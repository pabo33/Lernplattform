        <div class="keybox"><b>Sammellinse:</b> \(\dfrac1f=\dfrac1g+\dfrac1b\) (Gegenstandsweite \(g\), Bildweite \(b\)); Abbildungsmassstab \(\dfrac{B}{G}=\dfrac{b}{g}\).</div>`,
        example:{ task: L`Gegenstand \(g=30\,\mathrm{cm}\) vor einer Linse mit \(f=10\,\mathrm{cm}\). Bildweite?`,
          solution: L`<p>\(\dfrac1b=\dfrac1f-\dfrac1g=\dfrac1{10}-\dfrac1{30}=\dfrac{2}{30}\Rightarrow b=15\,\mathrm{cm}\).</p>` },
        problems:[
          {q: L`Licht geht von Luft (\(n=1\)) in Glas (\(n=1{,}5\)), Einfallswinkel \(30^\circ\). Brechungswinkel?`,
           a: L`<p>\(\sin\alpha_2=\dfrac{\sin30^\circ}{1{,}5}=0{,}333\Rightarrow\alpha_2\approx19{,}5^\circ\).</p>`},
          {q: L`\(f=20\,\mathrm{cm}\), \(g=60\,\mathrm{cm}\). Bildweite?`,
           a: L`<p>\(\dfrac1b=\dfrac1{20}-\dfrac1{60}=\dfrac{2}{60}\Rightarrow b=30\,\mathrm{cm}\).</p>`}
        ]}},
      {id:'p-o2', t:'Wellenoptik', h:'Interferenz und Beugung (Doppelspalt, Gitter).', s:'deepen', learn:{
        explain: L`<p>Kohärentes Licht kann sich verstärken oder auslöschen (Interferenz) — das zeigt die Wellennatur des Lichts.</p>
        <div class="keybox"><b>Maxima am Doppelspalt/Gitter:</b> \(d\sin\alpha=k\,\lambda\) (\(d\) = Spalt-/Gitterabstand, \(k=0,1,2,\dots\)).</div>`,
        example:{ task: L`Doppelspalt \(d=0{,}1\,\mathrm{mm}\), \(\lambda=500\,\mathrm{nm}\), 1. Maximum. Winkel?`,
          solution: L`<p>\(\sin\alpha=\dfrac{\lambda}{d}=\dfrac{5\cdot10^{-7}}{10^{-4}}=5\cdot10^{-3}\Rightarrow\alpha\approx0{,}29^\circ\).</p>` },
        problems:[
          {q: L`Gitter mit \(500\) Linien/mm, \(\lambda=600\,\mathrm{nm}\). Winkel des 1. Maximums?`,
           a: L`<p>\(d=\dfrac{1}{500\,000}\,\mathrm{m}=2\cdot10^{-6}\,\mathrm{m}\); \(\sin\alpha=\dfrac{\lambda}{d}=0{,}3\Rightarrow\alpha\approx17{,}5^\circ\).</p>`},
          {q: L`Was beweist das Interferenzmuster am Doppelspalt über die Natur des Lichts?`,
           a: L`<p>Licht verhält sich als Welle.</p>`}
        ]}}
    ]},
    {name:'Moderne Physik', topics:[
      {id:'p-q1', t:'Elektromagnetische Wellen', h:'Spektrum, Ausbreitung, Eigenschaften von Licht als Welle.', s:'deepen', learn:{
        explain: L`<p>Eine EM-Welle besteht aus schwingendem elektrischem und magnetischem Feld und breitet sich im Vakuum mit \(c=3\cdot10^{8}\,\mathrm{m/s}\) aus. Es gilt \(c=\lambda f\).</p>
        <div class="keybox"><b>Spektrum</b> (steigende Frequenz): Radio → Mikrowelle → Infrarot → sichtbar → UV → Röntgen → Gamma.</div>`,
        example:{ task: L`Radiowelle mit \(f=100\,\mathrm{MHz}\). Wellenlänge?`,
          solution: L`<p>\(\lambda=\dfrac{c}{f}=\dfrac{3\cdot10^{8}}{10^{8}}=3\,\mathrm{m}\).</p>` },
        problems:[
          {q: L`Rotes Licht mit \(\lambda=700\,\mathrm{nm}\). Frequenz?`,
           a: L`<p>\(f=\dfrac{c}{\lambda}=\dfrac{3\cdot10^{8}}{7\cdot10^{-7}}\approx4{,}3\cdot10^{14}\,\mathrm{Hz}\).</p>`},
          {q: L`Ordne nach zunehmender Frequenz: Röntgen, Radio, sichtbares Licht.`,
           a: L`<p>Radio &lt; sichtbar &lt; Röntgen.</p>`}
        ]}},
      {id:'p-q2', t:'Quantenphysik', h:'Photoeffekt, Photonen, Welle-Teilchen-Dualismus.', s:'review', learn:{
        explain: L`<div class="keybox"><b>Photonenenergie:</b> \(E=h f=\dfrac{h c}{\lambda}\), \(h=6{,}63\cdot10^{-34}\).</div>
        <p><b>Photoeffekt:</b> Erst ab einer Grenzfrequenz werden Elektronen ausgelöst: \(E_{kin}=h f-W_A\) (\(W_A\) = Austrittsarbeit). Licht zeigt Wellen- <i>und</i> Teilchencharakter.</p>`,
        example:{ task: L`Photon mit \(\lambda=500\,\mathrm{nm}\). Energie?`,
          solution: L`<p>\(E=\dfrac{h c}{\lambda}=\dfrac{6{,}63\cdot10^{-34}\cdot3\cdot10^{8}}{5\cdot10^{-7}}\approx4\cdot10^{-19}\,\mathrm{J}\).</p>` },
        problems:[
          {q: L`Energie eines Photons mit \(f=6\cdot10^{14}\,\mathrm{Hz}\)?`,
           a: L`<p>\(E=h f=6{,}63\cdot10^{-34}\cdot6\cdot10^{14}\approx4\cdot10^{-19}\,\mathrm{J}\).</p>`},
          {q: L`Austrittsarbeit \(3\cdot10^{-19}\,\mathrm{J}\); ein Photon liefert \(5\cdot10^{-19}\,\mathrm{J}\). Maximale kinetische Energie der Elektronen?`,
           a: L`<p>\(E_{kin}=5\cdot10^{-19}-3\cdot10^{-19}=2\cdot10^{-19}\,\mathrm{J}\).</p>`}
        ]}},
      {id:'p-q3', t:'Atomphysik', h:'Bohrsches Modell, Energieniveaus, Linienspektren.', s:'deepen', learn:{
        explain: L`<p>Im Bohr-Modell bewegen sich Elektronen auf diskreten Energieniveaus. Ein Übergang setzt Energie \(\Delta E=h f\) frei oder auf → charakteristische <b>Linienspektren</b>.</p>
        <div class="keybox">Wasserstoff: \(E_n=-\dfrac{13{,}6\,\mathrm{eV}}{n^2}\).</div>`,
        example:{ task: L`Übergang \(n=2\to n=1\) in Wasserstoff. Emittierte Energie?`,
          solution: L`<p>\(E_1=-13{,}6\,\mathrm{eV}\), \(E_2=-3{,}4\,\mathrm{eV}\); \(\Delta E=10{,}2\,\mathrm{eV}\).</p>` },
        problems:[
          {q: L`Warum zeigen Gase Linien- statt kontinuierliche Spektren?`,
           a: L`<p>Nur bestimmte, diskrete Energieübergänge zwischen den festen Niveaus sind möglich.</p>`},
          {q: L`Energie des Grundzustands (\(n=1\)) von Wasserstoff?`,
           a: L`<p>\(E_1=-13{,}6\,\mathrm{eV}\).</p>`}
        ]}},
      {id:'p-q4', t:'Kernphysik & Radioaktivität', h:'Zerfallsarten, Halbwertszeit, Kernreaktionen.', s:'deepen', learn:{
        explain: L`<div class="keybox"><b>Zerfallsarten:</b> \(\alpha\) (Heliumkern), \(\beta\) (Elektron/Positron), \(\gamma\) (Photon).</div>
        <p><b>Halbwertszeit</b> \(T_{1/2}\): Nach jeder \(T_{1/2}\) halbiert sich die Anzahl. \(N(t)=N_0\cdot\left(\tfrac12\right)^{t/T_{1/2}}\).</p>`,
        example:{ task: L`Wie viel Anteil bleibt nach 3 Halbwertszeiten übrig?`,
          solution: L`<p>\(\left(\tfrac12\right)^3=\tfrac18\).</p>` },
        problems:[
          {q: L`\(800\) Kerne, \(T_{1/2}=5\,\mathrm{min}\). Wie viele nach \(15\,\mathrm{min}\)?`,
           a: L`<p>\(15/5=3\) HWZ → \(800\cdot\tfrac18=100\).</p>`},
          {q: L`Welche Strahlung wird im Magnetfeld nicht abgelenkt?`,
           a: L`<p>\(\gamma\)-Strahlung (ungeladen).</p>`}
        ]}},
      {id:'p-q5', t:'Spezielle Relativitätstheorie', h:'Zeitdilatation, Längenkontraktion, Masse-Energie-Äquivalenz.', s:'deepen', learn:{
        explain: L`<p>Die Lichtgeschwindigkeit \(c\) ist für alle Beobachter gleich. Daraus folgen <b>Zeitdilatation</b> und <b>Längenkontraktion</b>.</p>
        <div class="keybox">\(\Delta t=\gamma\,\Delta t_0\) mit \(\gamma=\dfrac{1}{\sqrt{1-v^2/c^2}}\). Masse-Energie: \(E=m c^2\).</div>`,
        example:{ task: L`Ruheenergie von \(1\,\mathrm{g}\) Masse?`,
          solution: L`<p>\(E=m c^2=0{,}001\cdot(3\cdot10^{8})^2=9\cdot10^{13}\,\mathrm{J}\).</p>` },
        problems:[
          {q: L`Bei \(v=0{,}6c\): Lorentzfaktor \(\gamma\)?`,
           a: L`<p>\(\gamma=\dfrac{1}{\sqrt{1-0{,}36}}=\dfrac{1}{0{,}8}=1{,}25\).</p>`},
          {q: L`Ruheenergie eines Elektrons (\(m=9{,}11\cdot10^{-31}\,\mathrm{kg}\))?`,
           a: L`<p>\(E=m c^2=9{,}11\cdot10^{-31}\cdot9\cdot10^{16}\approx8{,}2\cdot10^{-14}\,\mathrm{J}\).</p>`}
        ]}}
    ]}
  ]
});
SUBJECTS.push({
  id:'chemie', name:'Chemie', dot:'#b23f36',
  note:'Chemie hattest du zuletzt in der Sekundarstufe I. Die Grundlagen (Stoffe, Reaktionen, Atombau, Bindung, einfache Organik) sind Wiederholung — der grosse Oberstufen-Block (Gleichgewicht, Energetik, Elektrochemie, Reaktionsmechanismen) ist neu.',
  areas:[
    {name:'Grundlagen & Atombau', topics:[
      {id:'c-g1', t:'Stoffe & Stofftrennung', h:'Reinstoffe/Gemische, Stoffeigenschaften, Trennverfahren.', s:'review', learn:{
        explain: L`<div class="keybox"><b>Reinstoff</b> (Element oder Verbindung, feste Eigenschaften) vs. <b>Gemisch</b> (homogen: Lösung/Legierung; heterogen: Suspension/Emulsion).</div>
        <p>Trennverfahren nutzen Eigenschaftsunterschiede: <b>Filtrieren</b> (Teilchengrösse), <b>Destillieren</b> (Siedepunkt), <b>Chromatographie</b> (Adsorption), <b>Extrahieren</b> (Löslichkeit).</p>`,
        example:{ task: L`Wie trennt man gelöstes Salz von Wasser?`,
          solution: L`<p>Durch Destillation/Eindampfen: Wasser verdampft, das Salz bleibt zurück.</p>` },
        problems:[
          {q: L`Welches Trennverfahren nutzt unterschiedliche Siedepunkte?`,
           a: L`<p>Die Destillation.</p>`},
          {q: L`Wie trennt man Sand von Wasser?`,
           a: L`<p>Durch Filtration.</p>`}
        ]}},
      {id:'c-g2', t:'Chemische Reaktion & Gleichungen', h:'Reaktionsschema, Reaktionsgleichungen ausgleichen, Massenerhaltung.', s:'review', learn:{
        explain: L`<p>Bei einer Reaktion werden Edukte zu Produkten umgewandelt (mit Energieumsatz). Wegen der <b>Massenerhaltung</b> muss jedes Element auf beiden Seiten gleich oft vorkommen.</p>
        <div class="keybox">Ausgleichen nur über <b>Koeffizienten</b> — die Indizes in den Formeln dürfen nicht verändert werden.</div>`,
        example:{ task: L`Gleiche aus: \(\ce{H2 + O2 -> H2O}\).`,
          solution: L`<p>\(\ce{2 H2 + O2 -> 2 H2O}\).</p>` },
        problems:[
          {q: L`Gleiche aus: \(\ce{C + O2 -> CO2}\).`,
           a: L`<p>Bereits ausgeglichen (\(1:1:1\)).</p>`},
          {q: L`Gleiche aus: \(\ce{Fe + O2 -> Fe2O3}\).`,
           a: L`<p>\(\ce{4 Fe + 3 O2 -> 2 Fe2O3}\).</p>`}
        ]}},
      {id:'c-g3', t:'Atombau', h:'Kern-Hülle-Modell, Protonen/Neutronen/Elektronen, Isotope.', s:'review', learn:{
        explain: L`<div class="keybox">Kern aus <b>Protonen</b> (Ordnungszahl \(Z\)) und <b>Neutronen</b>; Hülle aus <b>Elektronen</b>. Neutral: \(Z\) Protonen = \(Z\) Elektronen. Massenzahl \(A=\)Protonen + Neutronen.</div>
        <p><b>Isotope:</b> gleiche Protonenzahl, verschiedene Neutronenzahl.</p>`,
        example:{ task: L`\(\ce{^{40}Ca}\) (\(Z=20\)). Zahl an Protonen, Neutronen, Elektronen?`,
          solution: L`<p>20 Protonen, 20 Neutronen (\(40-20\)), 20 Elektronen.</p>` },
        problems:[
          {q: L`Ein Atom hat 17 Protonen und 18 Neutronen. Massenzahl und Element?`,
           a: L`<p>\(A=35\); Element Chlor (\(\ce{Cl}\)).</p>`},
          {q: L`Was unterscheidet zwei Isotope desselben Elements?`,
           a: L`<p>Die Neutronenzahl (die Protonenzahl ist gleich).</p>`}
        ]}},
      {id:'c-g4', t:'Orbitalmodell & Elektronenkonfiguration', h:'Schalen/Orbitale, Besetzungsregeln — über das Sek-I-Schalenmodell hinaus.', s:'new', learn:{
        explain: L`<p>Elektronen besetzen <b>Orbitale</b> (s, p, d) nach steigender Energie (Aufbauprinzip, Pauli, Hund). Die <b>Valenzelektronen</b> bestimmen das chemische Verhalten.</p>
        <div class="keybox">Beispiel Sauerstoff (\(Z=8\)): \(1s^2\,2s^2\,2p^4\).</div>`,
        example:{ task: L`Elektronenkonfiguration von Natrium (\(Z=11\))?`,
          solution: L`<p>\(1s^2\,2s^2\,2p^6\,3s^1\).</p>` },
        problems:[
          {q: L`Wie viele Valenzelektronen hat Sauerstoff (\(2s^2\,2p^4\))?`,
           a: L`<p>Sechs.</p>`},
          {q: L`Elektronenkonfiguration von Kohlenstoff (\(Z=6\))?`,
           a: L`<p>\(1s^2\,2s^2\,2p^2\).</p>`}
        ]}},
      {id:'c-g5', t:'Periodensystem & Periodizität', h:'Ordnungsprinzip, Trends (Atomradius, Elektronegativität, Ionisierung).', s:'deepen', learn:{
        explain: L`<p>Anordnung nach steigender Kernladung: <b>Gruppen</b> (senkrecht, gleiche Valenzelektronenzahl), <b>Perioden</b> (waagrecht).</p>
        <div class="keybox"><b>Trends:</b> Atomradius nimmt nach rechts ab und nach unten zu; Elektronegativität und Ionisierungsenergie nehmen nach rechts oben zu.</div>`,
        example:{ task: L`Was hat die höhere Elektronegativität: \(\ce{F}\) oder \(\ce{I}\)?`,
          solution: L`<p>Fluor (\(\ce{F}\)) — es steht weiter rechts oben.</p>` },
        problems:[
          {q: L`Welches Element hat den grösseren Atomradius: \(\ce{Na}\) oder \(\ce{Cl}\)?`,
           a: L`<p>Natrium (weiter links in der Periode).</p>`},
          {q: L`In welche Richtung im PSE steigt die Elektronegativität?`,
           a: L`<p>Nach rechts oben (zum Fluor).</p>`}
        ]}},
      {id:'c-g6', t:'Stöchiometrie', h:'Stoffmenge, molare Masse, Konzentration, Rechnen mit Gleichungen.', s:'deepen', learn:{
        explain: L`<div class="keybox"><b>Stoffmenge</b> \(n\) (mol): \(n=\dfrac{m}{M}\) (molare Masse \(M\) in g/mol). \(N_A=6{,}022\cdot10^{23}\) Teilchen/mol. <b>Konzentration</b> \(c=\dfrac{n}{V}\).</div>
        <p>In Reaktionsgleichungen entsprechen die Koeffizienten den Stoffmengenverhältnissen.</p>`,
        example:{ task: L`Wie viel mol sind \(36\,\mathrm{g}\) Wasser (\(M=18\,\mathrm{g/mol}\))?`,
          solution: L`<p>\(n=\dfrac{m}{M}=\dfrac{36}{18}=2\,\mathrm{mol}\).</p>` },
        problems:[
          {q: L`Molare Masse von \(\ce{CO2}\) (\(\ce{C}=12\), \(\ce{O}=16\))?`,
           a: L`<p>\(12+2\cdot16=44\,\mathrm{g/mol}\).</p>`},
          {q: L`Welche Konzentration hat \(0{,}5\,\mathrm{mol}\) in \(2\,\mathrm{L}\) Lösung?`,
           a: L`<p>\(c=\dfrac{n}{V}=0{,}25\,\mathrm{mol/L}\).</p>`}
        ]}}
    ]},
    {name:'Chemische Bindung', topics:[
      {id:'c-b1', t:'Ionenbindung & Salze', h:'Ionenbildung, Ionengitter, Eigenschaften von Salzen.', s:'review', learn:{
        explain: L`<p>Metall + Nichtmetall: Elektronenübergang bildet <b>Kationen</b> (+) und <b>Anionen</b> (−), die sich im <b>Ionengitter</b> anziehen.</p>
        <div class="keybox">Eigenschaften von Salzen: hohe Schmelzpunkte, spröde, leiten den Strom als Schmelze oder Lösung (frei bewegliche Ionen).</div>`,
        example:{ task: L`Wie bildet sich \(\ce{NaCl}\)?`,
          solution: L`<p>\(\ce{Na}\) gibt ein Elektron ab (\(\ce{Na+}\)), \(\ce{Cl}\) nimmt es auf (\(\ce{Cl-}\)): \(\ce{2 Na + Cl2 -> 2 NaCl}\).</p>` },
        problems:[
          {q: L`Warum leitet eine Kochsalzlösung den elektrischen Strom?`,
           a: L`<p>Weil frei bewegliche Ionen vorliegen.</p>`},
          {q: L`Welche Ionen bilden Magnesium und Sauerstoff in \(\ce{MgO}\)?`,
           a: L`<p>\(\ce{Mg^2+}\) und \(\ce{O^2-}\).</p>`}
        ]}},
      {id:'c-b2', t:'Elektronenpaarbindung & Molekülgeometrie', h:'Lewis-Formeln und Molekülform (VSEPR/EPA-Modell).', s:'deepen', learn:{
        explain: L`<p>Nichtmetalle teilen sich Elektronenpaare (kovalente Bindung). <b>Lewis-Formeln</b> zeigen bindende und freie Elektronenpaare.</p>
        <div class="keybox"><b>EPA/VSEPR:</b> Elektronenpaare stossen sich maximal ab → Formen wie linear, gewinkelt, trigonal-planar, tetraedrisch.</div>`,
        example:{ task: L`Welche Form hat das \(\ce{H2O}\)-Molekül?`,
          solution: L`<p>Gewinkelt (\(\approx104{,}5^\circ\)) — bedingt durch zwei freie Elektronenpaare am Sauerstoff.</p>` },
        problems:[
          {q: L`Welche Molekülform hat \(\ce{CH4}\)?`,
           a: L`<p>Tetraedrisch (\(\approx109{,}5^\circ\)).</p>`},
          {q: L`Welche Molekülform hat \(\ce{CO2}\)?`,
           a: L`<p>Linear (keine freien Paare am C, zwei Doppelbindungen).</p>`}
        ]}},
      {id:'c-b3', t:'Elektronegativität & Polarität', h:'Polare Bindungen, Dipolmoleküle.', s:'deepen', learn:{
        explain: L`<p><b>Elektronegativität (EN)</b> misst die Anziehung der Bindungselektronen. Grosse \(\Delta\)EN → polare Bindung (Partialladungen \(\delta+/\delta-\)); sehr gross → ionisch.</p>
        <div class="keybox">Ein Molekül ist ein <b>Dipol</b>, wenn sich die Bindungsdipole wegen der Geometrie nicht aufheben.</div>`,
        example:{ task: L`Ist \(\ce{CO2}\) ein Dipolmolekül?`,
          solution: L`<p>Nein: Die Bindungen sind polar, aber wegen der linearen Form heben sich die Dipole auf.</p>` },
        problems:[
          {q: L`Ist \(\ce{H2O}\) ein Dipolmolekül?`,
           a: L`<p>Ja — durch die gewinkelte Form heben sich die Dipole nicht auf.</p>`},
          {q: L`Welche Bindung ist stärker polar: \(\ce{C-H}\) oder \(\ce{O-H}\)?`,
           a: L`<p>\(\ce{O-H}\) (grössere \(\Delta\)EN).</p>`}
        ]}},
      {id:'c-b4', t:'Metallbindung', h:'Elektronengasmodell, Eigenschaften von Metallen.', s:'review', learn:{
        explain: L`<div class="keybox"><b>Elektronengasmodell:</b> positive Atomrümpfe in einem „See" frei beweglicher Elektronen.</div>
        <p>Das erklärt elektrische und thermische Leitfähigkeit, Verformbarkeit (duktil) und metallischen Glanz.</p>`,
        example:{ task: L`Warum sind Metalle verformbar?`,
          solution: L`<p>Die Gitterschichten lassen sich gegeneinander verschieben; das Elektronengas hält den Verbund weiter zusammen.</p>` },
        problems:[
          {q: L`Warum leiten Metalle den elektrischen Strom?`,
           a: L`<p>Durch die frei beweglichen Elektronen (Elektronengas).</p>`},
          {q: L`Nenne zwei typische Metalleigenschaften.`,
           a: L`<p>Zum Beispiel elektrische Leitfähigkeit und Verformbarkeit (auch Glanz).</p>`}
        ]}},
      {id:'c-b5', t:'Zwischenmolekulare Kräfte', h:'Van-der-Waals-Kräfte, Wasserstoffbrücken und ihre Folgen.', s:'new', learn:{
        explain: L`<div class="keybox">Kräfte zwischen Molekülen (schwächer als Bindungen): <b>Van-der-Waals</b> (mit Molekülgrösse steigend), <b>Dipol-Dipol</b>, <b>Wasserstoffbrücken</b> (H an N, O oder F).</div>
        <p>Sie bestimmen Siede-/Schmelzpunkte und die Löslichkeit.</p>`,
        example:{ task: L`Warum hat Wasser einen ungewöhnlich hohen Siedepunkt?`,
          solution: L`<p>Wegen der starken Wasserstoffbrücken zwischen den Molekülen.</p>` },
        problems:[
          {q: L`Welche zwischenmolekulare Kraft wirkt (am stärksten) zwischen Wassermolekülen?`,
           a: L`<p>Wasserstoffbrücken.</p>`},
          {q: L`Warum steigt der Siedepunkt der Alkane mit der Kettenlänge?`,
           a: L`<p>Grössere Moleküle haben stärkere Van-der-Waals-Kräfte.</p>`}
        ]}}
    ]},
    {name:'Energetik, Kinetik & Gleichgewicht', topics:[
      {id:'c-k1', t:'Energetik chemischer Reaktionen', h:'Exo-/endotherm, Reaktionsenthalpie, Energiediagramme.', s:'new', learn:{
        explain: L`<div class="keybox"><b>Exotherm:</b> gibt Energie ab, \(\Delta H<0\). <b>Endotherm:</b> nimmt Energie auf, \(\Delta H>0\).</div>
        <p>Im Energiediagramm ist die <b>Aktivierungsenergie</b> \(E_A\) der „Berg"; \(\Delta H\) ist die Energiedifferenz zwischen Edukten und Produkten.</p>`,
        example:{ task: L`Eine Verbrennung gibt Wärme ab. Welches Vorzeichen hat \(\Delta H\)?`,
          solution: L`<p>Negativ — die Reaktion ist exotherm.</p>` },
        problems:[
          {q: L`Eine Reaktion hat \(\Delta H=+50\,\mathrm{kJ/mol}\). Exo- oder endotherm?`,
           a: L`<p>Endotherm (\(\Delta H>0\)).</p>`},
          {q: L`Was beschreibt die Aktivierungsenergie?`,
           a: L`<p>Die Energie, die nötig ist, um die Reaktion in Gang zu bringen (Energieberg).</p>`}
        ]}},
      {id:'c-k2', t:'Reaktionsgeschwindigkeit & Katalyse', h:'Einflussgrössen, Aktivierungsenergie, Wirkung von Katalysatoren.', s:'new', learn:{
        explain: L`<div class="keybox">Einflüsse auf die Geschwindigkeit: Konzentration, Temperatur (RGT-Regel: \(+10\,^\circ\mathrm C\approx\) 2- bis 3-fach), Oberfläche/Zerteilungsgrad, Katalysator.</div>
        <p>Ein <b>Katalysator</b> senkt die Aktivierungsenergie und wird selbst nicht verbraucht.</p>`,
        example:{ task: L`Wie wirkt ein Katalysator?`,
          solution: L`<p>Er senkt die Aktivierungsenergie, sodass die Reaktion schneller läuft — ohne selbst verbraucht zu werden.</p>` },
        problems:[
          {q: L`Was passiert mit der Reaktionsgeschwindigkeit bei höherer Temperatur?`,
           a: L`<p>Sie steigt, weil mehr Teilchen genügend Energie haben.</p>`},
          {q: L`Wird ein Katalysator bei der Reaktion verbraucht?`,
           a: L`<p>Nein.</p>`}
        ]}},
      {id:'c-k3', t:'Chemisches Gleichgewicht & MWG', h:'Gleichgewichtszustand, Massenwirkungsgesetz, Gleichgewichtskonstante.', s:'new', learn:{
        explain: L`<p>Umkehrbare Reaktionen erreichen ein <b>dynamisches Gleichgewicht</b> (Hin- und Rückreaktion gleich schnell).</p>
        <div class="keybox"><b>MWG:</b> für \(\ce{aA + bB <=> cC + dD}\) gilt \(K=\dfrac{[C]^c[D]^d}{[A]^a[B]^b}\). Grosses \(K\) → Produkte überwiegen.</div>`,
        example:{ task: L`Was bedeutet ein grosser Wert von \(K\)?`,
          solution: L`<p>Im Gleichgewicht liegen überwiegend Produkte vor.</p>` },
        problems:[
          {q: L`Für \(\ce{A <=> B}\) ist \([B]=0{,}8\), \([A]=0{,}2\) (mol/L). Wie gross ist \(K\)?`,
           a: L`<p>\(K=\dfrac{[B]}{[A]}=\dfrac{0{,}8}{0{,}2}=4\).</p>`},
          {q: L`Was bedeutet „dynamisches" Gleichgewicht?`,
           a: L`<p>Hin- und Rückreaktion laufen weiter, aber gleich schnell — die Konzentrationen bleiben konstant.</p>`}
        ]}},
      {id:'c-k4', t:'Prinzip von Le Chatelier', h:'Verschiebung durch Druck, Temperatur und Konzentration.', s:'new', learn:{
        explain: L`<p><b>Prinzip vom kleinsten Zwang:</b> Stört man ein Gleichgewicht, verschiebt es sich so, dass die Störung verringert wird.</p>
        <div class="keybox">Druckerhöhung → Seite mit weniger Gasteilchen. Temperaturerhöhung → in die endotherme Richtung.</div>`,
        example:{ task: L`\(\ce{N2 + 3 H2 <=> 2 NH3}\) (exotherm). Wohin verschiebt eine Druckerhöhung das Gleichgewicht?`,
          solution: L`<p>Nach rechts — dorthin, wo weniger Gasmoleküle stehen (\(4\to2\)).</p>` },
        problems:[
          {q: L`Bei einer exothermen Reaktion wird die Temperatur erhöht. Wohin verschiebt sich das Gleichgewicht?`,
           a: L`<p>Nach links (zur endothermen Richtung, also zu den Edukten).</p>`},
          {q: L`Man entfernt laufend ein Produkt. Was passiert mit dem Gleichgewicht?`,
           a: L`<p>Es verschiebt sich zur Produktseite (es wird mehr Produkt nachgebildet).</p>`}
        ]}}
    ]},
    {name:'Säuren, Basen & Redox', topics:[
      {id:'c-r1', t:'Säuren & Basen (Brønsted)', h:'Protonendonator/-akzeptor, korrespondierende Paare.', s:'deepen', learn:{
        explain: L`<div class="keybox"><b>Säure</b> = Protonendonator (gibt \(\ce{H+}\) ab), <b>Base</b> = Protonenakzeptor (nimmt \(\ce{H+}\) auf).</div>
        <p><b>Korrespondierende Paare</b> unterscheiden sich um ein Proton. Wasser ist amphoter (kann beides).</p>`,
        example:{ task: L`\(\ce{HCl + H2O -> Cl- + H3O+}\). Nenne die korrespondierenden Paare.`,
          solution: L`<p>\(\ce{HCl}/\ce{Cl-}\) und \(\ce{H2O}/\ce{H3O+}\).</p>` },
        problems:[
          {q: L`Was ist eine Brønsted-Base?`,
           a: L`<p>Ein Protonenakzeptor.</p>`},
          {q: L`Nenne die korrespondierende Base zu \(\ce{NH4+}\).`,
           a: L`<p>\(\ce{NH3}\).</p>`}
        ]}},
      {id:'c-r2', t:'pH-Wert & Titration', h:'pH/pOH, Säurestärke (Ks/pKs), Neutralisation, Titrationskurven.', s:'new', learn:{
        explain: L`<div class="keybox">\(\mathrm{pH}=-\log[\ce{H3O+}]\); \(\mathrm{pH}+\mathrm{pOH}=14\) (bei \(25\,^\circ\mathrm C\)).</div>
        <p>Neutralisation: \(\ce{H3O+ + OH- -> 2 H2O}\). Bei einer <b>Titration</b> wird mit einer Masslösung bis zum Äquivalenzpunkt gemessen.</p>`,
        example:{ task: L`\([\ce{H3O+}]=10^{-3}\,\mathrm{mol/L}\). Wie gross ist der pH-Wert?`,
          solution: L`<p>\(\mathrm{pH}=-\log(10^{-3})=3\).</p>` },
        problems:[
          {q: L`Eine Lösung hat \(\mathrm{pH}=11\). Sauer oder basisch?`,
           a: L`<p>Basisch (\(\mathrm{pH}>7\)).</p>`},
          {q: L`\([\ce{H3O+}]=10^{-5}\,\mathrm{mol/L}\). pH und pOH?`,
           a: L`<p>\(\mathrm{pH}=5\), \(\mathrm{pOH}=9\).</p>`}
        ]}},
      {id:'c-r3', t:'Redoxreaktionen & Oxidationszahlen', h:'Elektronenübergang, Oxidationszahlen, Redoxgleichungen.', s:'deepen', learn:{
        explain: L`<div class="keybox"><b>Oxidation</b> = Elektronenabgabe (OZ steigt), <b>Reduktion</b> = Elektronenaufnahme (OZ sinkt). Das Reduktionsmittel wird oxidiert.</div>
        <p>Regeln für Oxidationszahlen: Element \(=0\), einfaches Ion \(=\) Ladung, \(\ce{O}\) meist \(-2\), \(\ce{H}\) meist \(+1\).</p>`,
        example:{ task: L`Welche Oxidationszahl hat Eisen in \(\ce{Fe2O3}\)?`,
          solution: L`<p>\(\ce{O}=-2\); \(2\cdot\mathrm{OZ(Fe)}+3\cdot(-2)=0\Rightarrow \mathrm{OZ(Fe)}=+3\).</p>` },
        problems:[
          {q: L`Oxidationszahl von Schwefel in \(\ce{SO4^2-}\)?`,
           a: L`<p>\(4\cdot(-2)+\mathrm{OZ(S)}=-2\Rightarrow \mathrm{OZ(S)}=+6\).</p>`},
          {q: L`\(\ce{Zn + Cu^2+ -> Zn^2+ + Cu}\): Was wird oxidiert?`,
           a: L`<p>Zink — es gibt Elektronen ab (OZ \(0\to+2\)).</p>`}
        ]}},
      {id:'c-r4', t:'Elektrochemie', h:'Galvanische Zellen, Spannungsreihe, Elektrolyse.', s:'new', learn:{
        explain: L`<div class="keybox"><b>Galvanische Zelle:</b> freiwillige Redoxreaktion liefert Spannung. Anode = Oxidation (−), Kathode = Reduktion (+). \(U=E_{\text{Kathode}}-E_{\text{Anode}}\).</div>
        <p>Die <b>Spannungsreihe</b> sagt Richtung und Spannung voraus. <b>Elektrolyse:</b> eine erzwungene Reaktion durch Stromzufuhr.</p>`,
        example:{ task: L`Daniell-Element (\(\ce{Zn}\)/\(\ce{Cu}\)): Welche Elektrode ist die Anode?`,
          solution: L`<p>Die Zink-Elektrode — Zink ist unedler und wird oxidiert.</p>` },
        problems:[
          {q: L`An welcher Elektrode findet die Reduktion statt?`,
           a: L`<p>An der Kathode.</p>`},
          {q: L`Was unterscheidet eine galvanische Zelle von einer Elektrolyse?`,
           a: L`<p>Die galvanische Zelle liefert Energie (freiwillig); die Elektrolyse benötigt Energie (erzwungen).</p>`}
        ]}}
    ]},
    {name:'Organische Chemie', topics:[
      {id:'c-o1', t:'Kohlenwasserstoffe & Nomenklatur', h:'Alkane, Alkene, Alkine benennen; homologe Reihen.', s:'deepen', learn:{
        explain: L`<div class="keybox"><b>Alkane</b> (nur Einfachbindungen, \(C_nH_{2n+2}\), Endung -an), <b>Alkene</b> (\(\ce{C=C}\), -en), <b>Alkine</b> (\(\ce{C#C}\), -in).</div>
        <p>Homologe Reihe: Meth-, Eth-, Prop-, But-, Pent-… Der Stammname folgt der längsten Kette.</p>`,
        example:{ task: L`Wie lautet die Summenformel von Propan?`,
          solution: L`<p>\(\ce{C3H8}\) (\(n=3\): \(2\cdot3+2=8\) H-Atome).</p>` },
        problems:[
          {q: L`Wie heisst das Alkan mit 4 C-Atomen und wie lautet seine Summenformel?`,
           a: L`<p>Butan, \(\ce{C4H10}\).</p>`},
          {q: L`Welches Strukturmerkmal kennzeichnet ein Alken?`,
           a: L`<p>Eine \(\ce{C=C}\)-Doppelbindung.</p>`}
        ]}},
      {id:'c-o2', t:'Isomerie', h:'Konstitutions-, Stereoisomerie, cis/trans.', s:'new', learn:{
        explain: L`<p>Isomere haben die gleiche Summenformel, aber verschiedene Struktur.</p>
        <div class="keybox"><b>Konstitutionsisomere</b> (verschiedene Verknüpfung). <b>Stereoisomere:</b> cis/trans an Doppelbindungen; Spiegelbildisomere (Enantiomere, Chiralität).</div>`,
        example:{ task: L`\(\ce{C4H10}\) besitzt zwei Isomere. Welche?`,
          solution: L`<p>n-Butan (gerade Kette) und Isobutan (verzweigt).</p>` },
        problems:[
          {q: L`Was sind Konstitutionsisomere?`,
           a: L`<p>Verbindungen mit gleicher Summenformel, aber unterschiedlicher Verknüpfung der Atome.</p>`},
          {q: L`Wodurch entsteht cis/trans-Isomerie?`,
           a: L`<p>Durch die eingeschränkte Drehbarkeit um eine \(\ce{C=C}\)-Doppelbindung.</p>`}
        ]}},
      {id:'c-o3', t:'Funktionelle Gruppen', h:'Alkohole, Aldehyde, Ketone, Carbonsäuren, Ester und ihre Eigenschaften.', s:'deepen', learn:{
        explain: L`<div class="keybox"><b>Alkohol</b> (\(\ce{-OH}\)), <b>Aldehyd</b> (\(\ce{-CHO}\)), <b>Keton</b> (\(\ce{C=O}\) innen), <b>Carbonsäure</b> (\(\ce{-COOH}\)), <b>Ester</b> (\(\ce{-COO-}\)).</div>
        <p>Oxidationsreihe: Alkohol → Aldehyd → Carbonsäure.</p>`,
        example:{ task: L`Welche funktionelle Gruppe kennzeichnet eine Carbonsäure?`,
          solution: L`<p>Die Carboxygruppe \(\ce{-COOH}\).</p>` },
        problems:[
          {q: L`Welche funktionelle Gruppe hat ein Alkohol?`,
           a: L`<p>Die Hydroxygruppe \(\ce{-OH}\).</p>`},
          {q: L`Was entsteht bei der Oxidation eines primären Alkohols (erste Stufe)?`,
           a: L`<p>Ein Aldehyd.</p>`}
        ]}},
      {id:'c-o4', t:'Reaktionstypen & Mechanismen', h:'Substitution, Addition, Eliminierung; Grundidee der Mechanismen.', s:'new', learn:{
        explain: L`<div class="keybox"><b>Substitution</b> (Austausch, z. B. radikalisch bei Alkanen), <b>Addition</b> (an Doppelbindungen), <b>Eliminierung</b> (Abspaltung, bildet eine Doppelbindung).</div>`,
        example:{ task: L`Wie reagiert Ethen mit Brom?`,
          solution: L`<p>Addition: \(\ce{C2H4 + Br2 -> C2H4Br2}\) (Bromwasser wird entfärbt).</p>` },
        problems:[
          {q: L`Welcher Reaktionstyp ist typisch für Alkene?`,
           a: L`<p>Die Addition an die Doppelbindung.</p>`},
          {q: L`Alkane reagieren mit Halogenen unter Lichteinwirkung. Welcher Reaktionstyp?`,
           a: L`<p>(Radikalische) Substitution.</p>`}
        ]}},
      {id:'c-o5', t:'Aromaten', h:'Benzol, Mesomerie, Grundreaktionen.', s:'new', learn:{
        explain: L`<p><b>Benzol</b> (\(\ce{C6H6}\)) ist ringförmig mit delokalisierten \(\pi\)-Elektronen (<b>Mesomerie</b>) und dadurch besonders stabil.</p>
        <div class="keybox">Aromaten reagieren bevorzugt über <b>elektrophile Substitution</b> — so bleibt das stabile Ringsystem erhalten.</div>`,
        example:{ task: L`Warum ist Benzol stabiler, als eine Struktur mit drei Doppelbindungen vermuten lässt?`,
          solution: L`<p>Die sechs \(\pi\)-Elektronen sind über den ganzen Ring delokalisiert (Mesomerie).</p>` },
        problems:[
          {q: L`Welche Summenformel hat Benzol?`,
           a: L`<p>\(\ce{C6H6}\).</p>`},
          {q: L`Welcher Reaktionstyp ist für Aromaten typisch?`,
           a: L`<p>Die elektrophile Substitution.</p>`}
        ]}},
      {id:'c-o6', t:'Makromoleküle & Kunststoffe', h:'Polymerisation, Polykondensation, Eigenschaften von Kunststoffen.', s:'new', learn:{
        explain: L`<div class="keybox"><b>Polymerisation:</b> Verknüpfung vieler Monomere an Doppelbindungen (z. B. Ethen → Polyethylen). <b>Polykondensation:</b> Verknüpfung unter Abspaltung kleiner Moleküle (z. B. Wasser).</div>
        <p>Kunststofftypen: Thermoplaste, Duroplaste, Elastomere.</p>`,
        example:{ task: L`Woraus entsteht Polyethylen?`,
          solution: L`<p>Aus vielen Ethen-Molekülen durch Polymerisation.</p>` },
        problems:[
          {q: L`Was wird bei einer Polykondensation abgespalten?`,
           a: L`<p>Kleine Moleküle, meist Wasser.</p>`},
          {q: L`Worin unterscheiden sich Polymerisation und Polykondensation?`,
           a: L`<p>Polymerisation läuft ohne Abspaltung (an Doppelbindungen), Polykondensation unter Abspaltung kleiner Moleküle.</p>`}
        ]}},
      {id:'c-o7', t:'Biomoleküle', h:'Kohlenhydrate, Fette, Proteine aus chemischer Sicht.', s:'new', learn:{
        explain: L`<div class="keybox"><b>Kohlenhydrate</b> (Zucker; Mono-/Di-/Polysaccharide). <b>Fette</b> (Ester aus Glycerin + 3 Fettsäuren). <b>Proteine</b> (Aminosäuren über Peptidbindungen).</div>
        <p>Die funktionellen Gruppen bestimmen jeweils die chemischen Reaktionen.</p>`,
        example:{ task: L`Aus welchen Bausteinen besteht ein Fett?`,
          solution: L`<p>Aus Glycerin und drei Fettsäuren (ein Triester).</p>` },
        problems:[
          {q: L`Welche Bindung verknüpft Aminosäuren in einem Protein?`,
           a: L`<p>Die Peptidbindung.</p>`},
          {q: L`Zu welcher Stoffklasse gehört Glucose?`,
           a: L`<p>Zu den Kohlenhydraten (ein Monosaccharid).</p>`}
        ]}}
    ]}
  ]
});
SUBJECTS.push({
  id:'biologie', name:'Biologie', dot:'#8a6d1f',
  note:'Biologie hattest du bis zur 10. Klasse. Schulstoff wie Zell-, Ökologie- und klassische Genetik-Grundlagen ist Wiederholung — der molekulare Oberstufen-Stoff (Stoffwechsel, Molekulargenetik, Neurobiologie) ist neu. An der ETH ist die Evolution der rote Faden.',
  areas:[
    {name:'Cytologie', topics:[
      {id:'b-c1', t:'Zelltypen & Zellorganellen', h:'Pro-/eukaryotische Zellen, Bau und Funktion der Organellen.', s:'deepen', learn:{
        explain: L`<p><b>Prokaryoten</b> (Bakterien): kein echter Zellkern, keine Membranorganellen, DNA frei im Cytoplasma. <b>Eukaryoten</b> (Tier, Pflanze, Pilz): echter Zellkern und membranumhüllte Organellen.</p>
        <div class="keybox">Wichtige Organellen: <b>Zellkern</b> (DNA), <b>Mitochondrium</b> (Zellatmung/ATP), <b>Ribosom</b> (Proteinsynthese), <b>ER</b> & <b>Golgi</b> (Synthese/Transport), <b>Chloroplast</b> (Fotosynthese, nur Pflanze), <b>Zellwand</b> & <b>Vakuole</b> (Pflanze).</div>`,
        example:{ task: L`Nenne drei Merkmale, die eine Pflanzenzelle von einer Tierzelle unterscheiden.`,
          solution: L`<p>Zellwand, Chloroplasten und eine grosse Zentralvakuole — alle drei fehlen der Tierzelle.</p>` },
        problems:[
          {q: L`Welches Organell liefert den Grossteil des ATP und wird „Kraftwerk der Zelle" genannt?`,
           a: L`<p>Das Mitochondrium — dort läuft die Zellatmung ab.</p>`},
          {q: L`Ein Organismus hat keinen Zellkern; die DNA liegt frei im Cytoplasma. Pro- oder eukaryotisch?`,
           a: L`<p>Prokaryotisch (z. B. ein Bakterium).</p>`}
        ]}},
      {id:'b-c2', t:'Biomembran & Stofftransport', h:'Membranaufbau, Diffusion, Osmose, aktiver Transport.', s:'new', learn:{
        explain: L`<p>Die <b>Biomembran</b> ist eine Phospholipid-Doppelschicht (hydrophile Köpfe aussen, hydrophobe Schwänze innen) mit eingelagerten Proteinen (Flüssigmosaik-Modell).</p>
        <div class="keybox"><b>Diffusion:</b> passiv entlang des Konzentrationsgefälles. <b>Osmose:</b> Diffusion von Wasser durch eine semipermeable Membran. <b>Aktiver Transport:</b> gegen das Gefälle, verbraucht ATP (z. B. Na⁺/K⁺-Pumpe).</div>`,
        example:{ task: L`Warum kann eine Zelle in reinem Wasser anschwellen und platzen?`,
          solution: L`<p>Innen ist die Konzentration gelöster Teilchen höher; durch Osmose strömt Wasser hinein, bis die Zelle platzt.</p>` },
        problems:[
          {q: L`Ein Transport läuft gegen das Konzentrationsgefälle und verbraucht ATP. Wie heisst er?`,
           a: L`<p>Aktiver Transport.</p>`},
          {q: L`In welche Richtung bewegt sich Wasser bei der Osmose?`,
           a: L`<p>Zur Seite mit der höheren Konzentration gelöster Teilchen (niedrigeres Wasserpotential).</p>`}
        ]}},
      {id:'b-c3', t:'Zellzyklus & Mitose', h:'Phasen der Zellteilung, Bedeutung für Wachstum.', s:'deepen', learn:{
        explain: L`<p><b>Zellzyklus:</b> Interphase (G1, <b>S</b> = DNA-Verdopplung, G2) und Mitose.</p>
        <div class="keybox"><b>Mitose-Phasen:</b> Prophase → Metaphase (Chromosomen in der Äquatorialebene) → Anaphase (Schwesterchromatiden trennen sich) → Telophase. Ergebnis: 2 genetisch identische Tochterzellen. Zweck: Wachstum und Regeneration.</div>`,
        example:{ task: L`In welcher Phase wird die DNA verdoppelt?`,
          solution: L`<p>In der S-Phase der Interphase, also vor der eigentlichen Mitose.</p>` },
        problems:[
          {q: L`Wie viele Tochterzellen entstehen bei einer Mitose und wie ähnlich sind sie der Mutterzelle?`,
           a: L`<p>Zwei Tochterzellen, genetisch identisch zur Mutterzelle.</p>`},
          {q: L`In welcher Phase werden die Schwesterchromatiden zu den Polen gezogen?`,
           a: L`<p>In der Anaphase.</p>`}
        ]}},
      {id:'b-c4', t:'Meiose', h:'Reifeteilung, Rekombination, Bedeutung für die Vererbung.', s:'new', learn:{
        explain: L`<p>Bei der <b>Meiose</b> entstehen aus einer diploiden (2n) Zelle in zwei Teilungsschritten vier haploide (n) Keimzellen.</p>
        <div class="keybox">Genetische Vielfalt durch <b>Crossing-over</b> (Prophase I) und die zufällige Verteilung der Chromosomen. Grundlage der sexuellen Fortpflanzung.</div>`,
        example:{ task: L`Warum ist die Meiose für die genetische Vielfalt wichtig?`,
          solution: L`<p>Crossing-over und zufällige Chromosomenverteilung erzeugen immer neu kombinierte Keimzellen.</p>` },
        problems:[
          {q: L`Wie viele Zellen mit welchem Chromosomensatz entstehen aus einer diploiden Zelle durch Meiose?`,
           a: L`<p>Vier haploide (n) Zellen.</p>`},
          {q: L`Was geschieht beim Crossing-over?`,
           a: L`<p>Homologe Chromosomen tauschen Abschnitte aus → neue Allelkombinationen.</p>`}
        ]}}
    ]},
    {name:'Biomoleküle & Stoffwechsel', topics:[
      {id:'b-s1', t:'Biomoleküle', h:'Kohlenhydrate, Lipide, Proteine, Nukleinsäuren — Bau und Funktion.', s:'new', learn:{
        explain: L`<div class="keybox"><b>Kohlenhydrate</b> (Bausteine: Monosaccharide wie Glucose) — Energie/Struktur. <b>Lipide</b> — Speicher & Membranen, unpolar. <b>Proteine</b> (Bausteine: Aminosäuren) — Enzyme, Struktur, Transport. <b>Nukleinsäuren</b> (Bausteine: Nukleotide) — Informationsspeicher (DNA/RNA).</div>`,
        example:{ task: L`Aus welchen Bausteinen bestehen Proteine?`,
          solution: L`<p>Aus Aminosäuren, die über Peptidbindungen verknüpft sind.</p>` },
        problems:[
          {q: L`Ordne zu: Glucose, Aminosäure, Nukleotid → Kohlenhydrat, Protein, Nukleinsäure.`,
           a: L`<p>Glucose → Kohlenhydrat, Aminosäure → Protein, Nukleotid → Nukleinsäure.</p>`},
          {q: L`Welche Biomolekülklasse bildet vor allem die Zellmembranen?`,
           a: L`<p>Lipide (Phospholipide).</p>`}
        ]}},
      {id:'b-s2', t:'Enzyme', h:'Wirkungsweise, Spezifität, Enzymkinetik und Hemmung.', s:'new', learn:{
        explain: L`<p><b>Enzyme</b> sind Biokatalysatoren (meist Proteine): Sie senken die <b>Aktivierungsenergie</b> und werden nicht verbraucht. Substratspezifisch (Schlüssel-Schloss / induced fit).</p>
        <div class="keybox">Abhängig von Temperatur und pH (Optimum; bei zu hoher Temperatur <b>Denaturierung</b>). Hemmung: <b>kompetitiv</b> (am aktiven Zentrum) oder <b>nicht-kompetitiv</b>.</div>`,
        example:{ task: L`Was passiert mit einem Enzym bei zu hoher Temperatur?`,
          solution: L`<p>Es denaturiert — die räumliche Struktur (und damit das aktive Zentrum) wird zerstört, die Funktion geht verloren.</p>` },
        problems:[
          {q: L`Wie wirkt ein Enzym auf die Aktivierungsenergie einer Reaktion?`,
           a: L`<p>Es senkt sie, sodass die Reaktion schneller abläuft.</p>`},
          {q: L`Ein Hemmstoff ähnelt dem Substrat und blockiert das aktive Zentrum. Welche Hemmungsart?`,
           a: L`<p>Kompetitive Hemmung.</p>`}
        ]}},
      {id:'b-s3', t:'Zellatmung', h:'Glykolyse, Citratzyklus, Atmungskette — Grundzüge der Dissimilation.', s:'new', learn:{
        explain: L`<p>Abbau von Glucose zur ATP-Gewinnung: \(\ce{C6H12O6 + 6 O2 -> 6 CO2 + 6 H2O}\).</p>
        <div class="keybox"><b>Glykolyse</b> (Cytoplasma): Glucose → 2 Pyruvat. <b>Citratzyklus</b> (Mitochondrienmatrix). <b>Atmungskette</b> (innere Mitochondrienmembran): O₂ als Endakzeptor, liefert den Grossteil des ATP.</div>`,
        example:{ task: L`Wo entsteht der grösste Teil des ATP?`,
          solution: L`<p>In der Atmungskette an der inneren Mitochondrienmembran.</p>` },
        problems:[
          {q: L`Nenne die Endprodukte der vollständigen Zellatmung von Glucose.`,
           a: L`<p>\(\ce{CO2}\) und \(\ce{H2O}\) (sowie ATP).</p>`},
          {q: L`Welches Molekül ist der finale Elektronenakzeptor der Atmungskette?`,
           a: L`<p>Sauerstoff (\(\ce{O2}\)).</p>`}
        ]}},
      {id:'b-s4', t:'Fotosynthese', h:'Licht- und Dunkelreaktion, Bedeutung für den Energiehaushalt.', s:'new', learn:{
        explain: L`<p>Aufbau von Glucose aus \(\ce{CO2}\) und Wasser mit Lichtenergie im Chloroplasten: \(\ce{6 CO2 + 6 H2O -> C6H12O6 + 6 O2}\).</p>
        <div class="keybox"><b>Lichtreaktion</b> (Thylakoide): Wasser wird gespalten, \(\ce{O2}\) frei, ATP + NADPH entstehen. <b>Calvin-Zyklus</b> (Stroma): \(\ce{CO2}\)-Fixierung zu Glucose.</div>`,
        example:{ task: L`Woher stammt der bei der Fotosynthese freigesetzte Sauerstoff?`,
          solution: L`<p>Aus der Spaltung des Wassers in der Lichtreaktion.</p>` },
        problems:[
          {q: L`Nenne Ausgangsstoffe und Produkte der Fotosynthese.`,
           a: L`<p>Aus \(\ce{CO2}\) + \(\ce{H2O}\) (+ Licht) entstehen Glucose + \(\ce{O2}\).</p>`},
          {q: L`In welchem Teil des Chloroplasten läuft der Calvin-Zyklus ab?`,
           a: L`<p>Im Stroma.</p>`}
        ]}}
    ]},
    {name:'Genetik', topics:[
      {id:'b-g1', t:'Klassische Genetik', h:'Mendelsche Regeln, Kreuzungsschemata, Erbgänge.', s:'review', learn:{
        explain: L`<div class="keybox"><b>Mendel:</b> Uniformität (F1), Spaltung (3:1 im F2 monohybrid), Unabhängigkeit.</div>
        <p>Begriffe: dominant/rezessiv, homozygot/heterozygot, Genotyp/Phänotyp. Kreuzungen mit dem Punnett-Quadrat auswerten.</p>`,
        example:{ task: L`Kreuzung \(Aa\times Aa\). Welches Phänotyp-Verhältnis?`,
          solution: L`<p>\(3:1\) (dominant : rezessiv); Genotypen \(1\,AA:2\,Aa:1\,aa\).</p>` },
        problems:[
          {q: L`\(Aa\times aa\): Welcher Anteil der Nachkommen ist phänotypisch rezessiv?`,
           a: L`<p>50 % (Verhältnis \(1\,Aa:1\,aa\)).</p>`},
          {q: L`Zwei heterozygote Eltern (\(Aa\)): Wahrscheinlichkeit für ein reinerbig rezessives Kind (\(aa\))?`,
           a: L`<p>\(\tfrac14\).</p>`}
        ]}},
      {id:'b-g2', t:'Molekulargenetik', h:'DNA-Aufbau, Replikation, Chromosomen.', s:'deepen', learn:{
        explain: L`<p><b>DNA:</b> Doppelhelix aus Nukleotiden (Desoxyribose, Phosphat, Base). Komplementäre Basenpaarung <b>A–T</b> und <b>G–C</b>.</p>
        <div class="keybox"><b>Replikation</b> ist semikonservativ: Jeder Strang dient als Vorlage für einen neuen Gegenstrang.</div>`,
        example:{ task: L`Ein DNA-Strang lautet 3'-TAC GGA-5'. Wie lautet der Komplementärstrang?`,
          solution: L`<p>5'-ATG CCT-3' (A–T, G–C).</p>` },
        problems:[
          {q: L`Welche Base paart mit Guanin?`,
           a: L`<p>Cytosin (G–C).</p>`},
          {q: L`Was bedeutet „semikonservative" Replikation?`,
           a: L`<p>Jede Tochter-DNA besteht aus einem alten und einem neu synthetisierten Strang.</p>`}
        ]}},
      {id:'b-g3', t:'Proteinbiosynthese', h:'Transkription, Translation, genetischer Code.', s:'new', learn:{
        explain: L`<div class="keybox"><b>Transkription</b> (Zellkern): DNA → mRNA (Base <b>U</b> statt T). <b>Translation</b> (Ribosom): mRNA-Codons (Basentripletts) → Aminosäuren, vermittelt durch tRNA.</div>
        <p>Start: AUG; es gibt Stopp-Codons. Der genetische Code ist ein Triplett-Code.</p>`,
        example:{ task: L`Wofür codiert das mRNA-Codon AUG?`,
          solution: L`<p>Für Start / die Aminosäure Methionin.</p>` },
        problems:[
          {q: L`DNA-Vorlage 3'-TAC-5' → welches mRNA-Codon entsteht?`,
           a: L`<p>AUG.</p>`},
          {q: L`Wie viele Basen codieren eine Aminosäure?`,
           a: L`<p>Drei (ein Triplett/Codon).</p>`}
        ]}},
      {id:'b-g4', t:'Genregulation', h:'Steuerung der Genaktivität (z. B. Operon-Modell).', s:'new', learn:{
        explain: L`<p>Nicht alle Gene sind ständig aktiv. Bei Bakterien beschreibt das <b>Operon-Modell</b> (z. B. lac-Operon) die Steuerung: Regulatorgen, Operator, Promotor; das Substrat kann Gene an- oder abschalten.</p>
        <div class="keybox">Bei Eukaryoten komplexer: Transkriptionsfaktoren, Epigenetik.</div>`,
        example:{ task: L`Wozu dient Genregulation?`,
          solution: L`<p>Damit die Zelle nur die aktuell benötigten Proteine bildet — Anpassung, Differenzierung und Ressourcen sparen.</p>` },
        problems:[
          {q: L`Welche Rolle spielt der Operator im Operon-Modell?`,
           a: L`<p>Er ist die Bindestelle des Repressors und steuert, ob die Strukturgene abgelesen werden.</p>`},
          {q: L`Warum bilden Körperzellen trotz gleicher DNA unterschiedliche Proteine?`,
           a: L`<p>Durch unterschiedliche Genregulation — in verschiedenen Zellen sind verschiedene Gene aktiv.</p>`}
        ]}},
      {id:'b-g5', t:'Mutationen', h:'Gen-, Chromosomen- und Genommutationen und ihre Folgen.', s:'deepen', learn:{
        explain: L`<div class="keybox"><b>Genmutation</b> (einzelne Basen, Punktmutation), <b>Chromosomenmutation</b> (Struktur), <b>Genommutation</b> (Chromosomenzahl, z. B. Trisomie).</div>
        <p>Folgen: oft neutral, manchmal schädlich, selten vorteilhaft — Grundlage genetischer Variabilität.</p>`,
        example:{ task: L`Eine einzelne Base wird ausgetauscht. Welche Mutationsebene?`,
          solution: L`<p>Genmutation (Punktmutation).</p>` },
        problems:[
          {q: L`Trisomie 21 betrifft die Chromosomenzahl. Welcher Mutationstyp?`,
           a: L`<p>Genommutation.</p>`},
          {q: L`Sind Mutationen immer schädlich?`,
           a: L`<p>Nein — viele sind neutral, manche schädlich, selten vorteilhaft.</p>`}
        ]}},
      {id:'b-g6', t:'Gentechnik & Biotechnologie', h:'Restriktionsenzyme, PCR, Klonierung, Anwendungen.', s:'new', learn:{
        explain: L`<div class="keybox"><b>Werkzeuge:</b> Restriktionsenzyme (schneiden DNA an bestimmten Sequenzen), Ligase (verknüpft), Plasmide (Vektoren). <b>PCR:</b> vervielfältigt DNA (Denaturieren → Primer anlagern → verlängern), exponentiell.</div>
        <p>Anwendungen: Insulinproduktion, Diagnostik, gentechnisch veränderte Organismen.</p>`,
        example:{ task: L`Wozu dient die PCR?`,
          solution: L`<p>Zum Vervielfältigen kleiner DNA-Mengen — die Menge verdoppelt sich pro Zyklus.</p>` },
        problems:[
          {q: L`Welches Enzym schneidet DNA an spezifischen Sequenzen?`,
           a: L`<p>Ein Restriktionsenzym (Restriktionsendonuklease).</p>`},
          {q: L`Um welchen Faktor steigt die DNA-Menge nach \(n\) PCR-Zyklen ungefähr?`,
           a: L`<p>Etwa um den Faktor \(2^n\).</p>`}
        ]}}
    ]},
    {name:'Neurobiologie', topics:[
      {id:'b-n1', t:'Nervenzelle & Potenziale', h:'Bau des Neurons, Ruhe- und Aktionspotenzial.', s:'new', learn:{
        explain: L`<p><b>Neuron:</b> Dendriten (Eingang) → Soma → Axon (Weiterleitung), oft mit Myelinscheide (schnellere, saltatorische Leitung).</p>
        <div class="keybox"><b>Ruhepotential</b> \(\approx -70\,\mathrm{mV}\) (Na⁺/K⁺-Pumpe, ungleiche Ionenverteilung). <b>Aktionspotential:</b> Reiz über Schwelle → Depolarisation (Na⁺ ein) → Repolarisation (K⁺ aus). Es gilt das „Alles-oder-Nichts-Prinzip".</div>`,
        example:{ task: L`Was hält das Ruhepotential aufrecht?`,
          solution: L`<p>Die Na⁺/K⁺-Pumpe zusammen mit der selektiven Ionendurchlässigkeit der Membran.</p>` },
        problems:[
          {q: L`Welches Ion strömt bei der Depolarisation in die Zelle?`,
           a: L`<p>Natrium (Na⁺).</p>`},
          {q: L`Was bedeutet das „Alles-oder-Nichts-Prinzip"?`,
           a: L`<p>Ab Überschreiten der Schwelle entsteht ein volles Aktionspotential, sonst keines — unabhängig von der Reizstärke.</p>`}
        ]}},
      {id:'b-n2', t:'Synapse', h:'Erregungsübertragung, Neurotransmitter, Verschaltung.', s:'new', learn:{
        explain: L`<p>Die <b>Synapse</b> ist die Kontaktstelle zweier Neurone. Die Übertragung ist chemisch:</p>
        <div class="keybox">Aktionspotential → Ca²⁺ strömt ein → Neurotransmitter (z. B. Acetylcholin) werden in den synaptischen Spalt ausgeschüttet → Bindung an Rezeptoren der Folgezelle (erregend oder hemmend) → anschliessend Abbau/Wiederaufnahme.</div>`,
        example:{ task: L`Wie wird das Signal über den synaptischen Spalt übertragen?`,
          solution: L`<p>Chemisch, durch Neurotransmitter.</p>` },
        problems:[
          {q: L`Welches Ion löst die Ausschüttung der Neurotransmitter aus?`,
           a: L`<p>Calcium (Ca²⁺).</p>`},
          {q: L`Nenne einen erregenden Neurotransmitter.`,
           a: L`<p>Zum Beispiel Acetylcholin (oder Glutamat).</p>`}
        ]}}
    ]},
    {name:'Evolution', topics:[
      {id:'b-e1', t:'Evolutionsfaktoren', h:'Mutation, Rekombination, Selektion, Gendrift, Isolation.', s:'deepen', learn:{
        explain: L`<div class="keybox"><b>Mutation</b> (liefert neue Allele) · <b>Rekombination</b> (neue Kombinationen) · <b>Selektion</b> (unterschiedlicher Fortpflanzungserfolg) · <b>Gendrift</b> (Zufall in kleinen Populationen) · <b>Isolation</b> (unterbindet Genfluss → Artbildung).</div>`,
        example:{ task: L`Welcher Faktor liefert die „Rohstoffe" (neue Allele) der Evolution?`,
          solution: L`<p>Die Mutation.</p>` },
        problems:[
          {q: L`In einer kleinen Population ändern sich Allelfrequenzen rein zufällig. Welcher Faktor?`,
           a: L`<p>Gendrift.</p>`},
          {q: L`Warum ist Selektion nicht zufällig?`,
           a: L`<p>Sie bevorzugt gezielt besser angepasste Varianten mit höherem Fortpflanzungserfolg.</p>`}
        ]}},
      {id:'b-e2', t:'Belege der Evolution', h:'Fossilien, Homologien, molekulare Belege.', s:'deepen', learn:{
        explain: L`<p>Belege: <b>Fossilien</b> (zeitliche Abfolge, Übergangsformen), <b>vergleichende Anatomie</b>, <b>molekulare</b> Ähnlichkeit von DNA/Proteinen, Embryologie.</p>
        <div class="keybox"><b>Homologie:</b> gleicher Grundbauplan, gemeinsame Herkunft (z. B. Wirbeltier-Extremität). <b>Analogie:</b> gleiche Funktion, verschiedene Herkunft.</div>`,
        example:{ task: L`Vordergliedmassen von Mensch, Wal und Fledermaus haben denselben Grundbauplan. Homologie oder Analogie?`,
          solution: L`<p>Homologie.</p>` },
        problems:[
          {q: L`Vogelflügel und Insektenflügel: gleiche Funktion, verschiedene Herkunft. Was ist das?`,
           a: L`<p>Analogie.</p>`},
          {q: L`Warum sind DNA-Vergleiche ein Beleg für Verwandtschaft?`,
           a: L`<p>Je ähnlicher die DNA, desto näher die Verwandtschaft bzw. desto jünger der gemeinsame Vorfahr.</p>`}
        ]}},
      {id:'b-e3', t:'Populationsgenetik', h:'Allelfrequenzen, Hardy-Weinberg-Gleichgewicht.', s:'new', learn:{
        explain: L`<p>Im <b>Hardy-Weinberg-Gleichgewicht</b> bleiben die Allelfrequenzen einer idealen Population konstant.</p>
        <div class="keybox">Mit \(p+q=1\) gilt \(p^2+2pq+q^2=1\): \(p^2\) = homozygot dominant, \(2pq\) = heterozygot, \(q^2\) = homozygot rezessiv. Abweichungen zeigen wirkende Evolutionsfaktoren.</div>`,
        example:{ task: L`Der rezessive Phänotyp tritt mit \(q^2=0{,}04\) auf. Allelfrequenzen \(p\) und \(q\)?`,
          solution: L`<p>\(q=\sqrt{0{,}04}=0{,}2\); \(p=1-q=0{,}8\).</p>` },
        problems:[
          {q: L`Wenn \(q=0{,}3\): Wie gross ist der Anteil Heterozygoter \(2pq\)?`,
           a: L`<p>\(p=0{,}7\); \(2pq=2\cdot0{,}7\cdot0{,}3=0{,}42=42\%\).</p>`},
          {q: L`16 % zeigen ein rezessives Merkmal (\(q^2=0{,}16\)). Wie gross ist \(q\)?`,
           a: L`<p>\(q=\sqrt{0{,}16}=0{,}4\).</p>`}
        ]}},
      {id:'b-e4', t:'Artbildung & Stammesgeschichte', h:'Mechanismen der Artbildung, Verwandtschaft, Phylogenese.', s:'deepen', learn:{
        explain: L`<p>Eine <b>Art</b> ist eine Fortpflanzungsgemeinschaft (Biospezies).</p>
        <div class="keybox"><b>Allopatrische Artbildung:</b> geografische Trennung → unabhängige Entwicklung → reproduktive Isolation. <b>Sympatrisch:</b> ohne räumliche Trennung. Phylogenese zeigt Verwandtschaft in Stammbäumen.</div>`,
        example:{ task: L`Wie führt geografische Trennung zu neuen Arten?`,
          solution: L`<p>Die getrennten Populationen entwickeln sich unabhängig, bis sie sich nicht mehr miteinander fortpflanzen können (Isolation).</p>` },

const STATUS = { review:{label:'Wiederholen'}, deepen:{label:'Vertiefen'}, new:{label:'Neu lernen'} };
const CYCLE = ['review','deepen','new'];

/* ---------- Persistenz ---------- */
const STORE_KEY = 'eth-prep-v2';
let store = {}; let memoryOnly = false;
try{ const raw = localStorage.getItem(STORE_KEY); store = raw ? JSON.parse(raw) : {}; localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
catch(e){ memoryOnly = true; store = {}; }
function save(){ if(memoryOnly) return; try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){ memoryOnly = true; } }
function rec(id){ return store[id] || (store[id] = {}); }
function isDone(id){ return !!(store[id] && store[id].done); }
function statusOf(topic){ const r = store[topic.id]; return (r && r.status) || topic.s; }

/* ---------- Ableitungen ---------- */
function subjectStats(subj){
  const st = {total:0, done:0, review:0, deepen:0, new:0, openReview:0, openDeepen:0, openNew:0};
  subj.areas.forEach(a=>a.topics.forEach(tp=>{
    st.total++; const s = statusOf(tp); st[s]++;
    if(isDone(tp.id)) st.done++; else st['open'+s.charAt(0).toUpperCase()+s.slice(1)]++;
  }));
  st.pct = st.total ? Math.round(st.done/st.total*100) : 0; return st;
}
function globalStats(){
  const g = {total:0, done:0, openReview:0, openDeepen:0, openNew:0};
  SUBJECTS.forEach(s=>{ const st = subjectStats(s);
    g.total+=st.total; g.done+=st.done; g.openReview+=st.openReview; g.openDeepen+=st.openDeepen; g.openNew+=st.openNew; });
  g.pct = g.total ? Math.round(g.done/g.total*100) : 0; return g;
}
function flatTopics(subj){ const f=[]; subj.areas.forEach(a=>a.topics.forEach(t=>f.push(t))); return f; }
function findTopic(id){
  for(const subj of SUBJECTS){ for(const area of subj.areas){
    if(area.topics.some(t=>t.id===id)){ const flat=flatTopics(subj); return {subj, area, topic:area.topics.find(t=>t.id===id), flat, index:flat.findIndex(t=>t.id===id)}; } } }
  return null;
}

/* ---------- MathJax ---------- */
function typeset(el){ if(el && window.MathJax && MathJax.typesetPromise){ MathJax.typesetPromise([el]).catch(()=>{}); } }

/* ---------- State ---------- */
let currentView = 'overview'; let currentTopic = null; let filterStatus = 'all'; let hideDone = false;

/* ---------- Nav ---------- */
function renderNav(){
  const nav = document.getElementById('nav'); const g = globalStats();
  let html = `<div class="nav__label">Ansicht</div>` + navItem('overview','Übersicht','var(--accent)', g.pct, currentView==='overview' && !currentTopic);
  html += `<div class="nav__label">Fächer</div>`;
  SUBJECTS.forEach(s=>{ const st = subjectStats(s); html += navItem(s.id, s.name, s.dot, st.pct, currentView===s.id); });
  nav.innerHTML = html;
  nav.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{ go(b.getAttribute('data-nav')); document.getElementById('nav').classList.remove('is-open'); }));
}
function navItem(id,name,color,pct,active){
  return `<button class="navitem ${active?'is-active':''}" data-nav="${id}">
    <span class="navitem__dot" style="background:${color}"></span>
    <span class="navitem__name">${name}</span><span class="navitem__pct">${pct}%</span></button>`;
}

/* ---------- Router ---------- */
function go(view){ currentView = view; currentTopic = null; filterStatus='all'; window.scrollTo(0,0); render(); }
function openTopic(id){ const f = findTopic(id); if(!f) return; currentView = f.subj.id; currentTopic = id; window.scrollTo(0,0); render(); }
function render(){ renderNav(); if(currentTopic){ renderTopicPage(); } else if(currentView==='overview'){ renderOverview(); } else { renderSubject(SUBJECTS.find(s=>s.id===currentView)); } }

/* ---------- Overview ---------- */

      <div class="segbar__seg seg--deepen" style="width:${seg(g.openDeepen)}%"></div>
      <div class="segbar__seg seg--new" style="width:${seg(g.openNew)}%"></div></div>
    <div class="legend">
      <div class="legend__item"><span class="legend__sw" style="background:var(--accent)"></span>Gelernt <span class="legend__n">${g.done}</span></div>

/* ---------- Fach-Ansicht (Liste) ---------- */
function renderSubject(subj){
  const st = subjectStats(subj); const p = (n)=> st.total?(n/st.total*100):0; const wrap = document.getElementById('wrap');
  let areasHtml = '';
  subj.areas.forEach(area=>{
    const rows = area.topics.filter(tp=>{
      if(filterStatus!=='all' && statusOf(tp)!==filterStatus) return false;
      if(hideDone && isDone(tp.id)) return false; return true; });
    if(!rows.length) return;
    areasHtml += `<section class="area"><div class="area__head">
        <h2 class="area__title">${area.name}</h2>
        <span class="area__count">${area.topics.filter(t=>isDone(t.id)).length}/${area.topics.length}</span>
        <span class="area__rule"></span></div>
      <div class="list">${rows.map(topicRow).join('')}</div></section>`;
  });
  if(!areasHtml) areasHtml = `<div class="empty">Mit diesem Filter sind hier keine Themen sichtbar.</div>`;
  wrap.innerHTML = `
  <div class="view-head"><h1 class="view-title">${subj.name}</h1><p class="view-desc">${subj.note}</p></div>
  <div class="subhead"><div class="subhead__bar">
    <div class="segbar">
      <div class="segbar__seg seg--done" style="width:${p(st.done)}%"></div>
      <div class="segbar__seg seg--review" style="width:${p(st.openReview)}%"></div>
      <div class="segbar__seg seg--deepen" style="width:${p(st.openDeepen)}%"></div>
      <div class="segbar__seg seg--new" style="width:${p(st.openNew)}%"></div></div>
    <div class="subhead__stats">
      <span class="stat"><span class="stat__dot" style="background:var(--accent)"></span>Gelernt <span class="stat__n">${st.done}/${st.total}</span></span>
      <span class="stat"><span class="stat__dot" style="background:var(--review)"></span>Wiederholen <span class="stat__n">${st.review}</span></span>
      <span class="stat"><span class="stat__dot" style="background:var(--deepen)"></span>Vertiefen <span class="stat__n">${st.deepen}</span></span>
      <span class="stat"><span class="stat__dot" style="background:var(--new)"></span>Neu <span class="stat__n">${st.new}</span></span>
    </div></div></div>
  <div class="toolbar"><div class="chips">
      ${chip('all','Alle')}${chip('review','Wiederholen')}${chip('deepen','Vertiefen')}${chip('new','Neu lernen')}</div>
    <span class="toolbar__spacer"></span>
    <label class="toggle"><input type="checkbox" id="hideDone" ${hideDone?'checked':''}>
      <span class="toggle__track"></span>Gelernte ausblenden</label></div>
  ${areasHtml}
  ${memoryOnly?memoryWarn():''}`;
  wrap.querySelectorAll('[data-chip]').forEach(c=>c.addEventListener('click',()=>{ filterStatus = c.getAttribute('data-chip'); renderSubject(subj); }));
  wrap.querySelector('#hideDone').addEventListener('change',e=>{ hideDone=e.target.checked; renderSubject(subj); });
  bindTopicRows(subj);
}
function chip(val,label){ return `<button class="chip ${filterStatus===val?'is-on':''}" data-chip="${val}">${label}</button>`; }

function topicRow(tp){
  const s = statusOf(tp); const done = isDone(tp.id); const r = store[tp.id]||{};
  const overridden = r.status && r.status!==tp.s;
  return `<div class="topic ${done?'is-done':''}" data-status="${s}" data-id="${tp.id}" tabindex="0" role="button" aria-label="${tp.t} öffnen">
    <div class="topic__row">
      <input type="checkbox" class="check" ${done?'checked':''} data-check aria-label="${tp.t} als gelernt markieren">
      <div class="topic__body"><div class="topic__line">
        <span class="topic__name">${tp.t}</span>
        <button class="badge" data-s="${s}" data-badge title="Einstufung ändern">${STATUS[s].label}${overridden?' <span class="badge__edit">·angepasst</span>':''}</button>
      </div><div class="topic__hint">${tp.h}</div></div>
      <span class="topic__go" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></span>
    </div></div>`;
}

function bindTopicRows(subj){
  const wrap = document.getElementById('wrap');
  wrap.querySelectorAll('.topic').forEach(row=>{
    const id = row.getAttribute('data-id');
    const skip = (e)=> e.target.closest('[data-check]') || e.target.closest('[data-badge]');
    row.addEventListener('click', e=>{ if(skip(e)) return; openTopic(id); });
    row.addEventListener('keydown', e=>{ if(skip(e)) return; if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openTopic(id); } });
    const chk = row.querySelector('[data-check]');
    chk.addEventListener('click', e=>e.stopPropagation());
    chk.addEventListener('change', e=>{ rec(id).done = e.target.checked; save(); renderSubject(subj); });
    row.querySelector('[data-badge]').addEventListener('click', e=>{
      e.stopPropagation();
      const cur = statusOf({id, s: row.getAttribute('data-status')});
      rec(id).status = CYCLE[(CYCLE.indexOf(cur)+1)%CYCLE.length]; save(); renderSubject(subj);
    });
  });
}

/* ---------- Themenseite ---------- */
function learnHtml(tp){
  if(!tp.learn){ return `<div class="lesson-placeholder"><b>Lerninhalt folgt.</b> Für dieses Thema kommen Erklärung, Beispiel und Übungsaufgaben in einer der nächsten Etappen dazu. Notizen kannst du hier schon festhalten.</div>`; }
  const l = tp.learn;
  const probs = (l.problems||[]).map((p,i)=>`
    <div class="prob">
      <div class="prob__q"><span class="prob__num">${i+1}</span><span>${p.q}</span></div>
      <button class="prob__reveal" data-reveal aria-expanded="false">Lösung anzeigen</button>
      <div class="prob__sol">${p.a}</div>
    </div>`).join('');
  return `<div class="lesson">
    <div class="lesson__sec"><div class="lesson__label">Erklärung</div><div class="lesson__body">${l.explain}</div></div>
    ${l.example?`<div class="lesson__sec"><div class="lesson__label">Beispiel</div>
      <div class="example"><div class="example__q">${l.example.task}</div><div class="example__a">${l.example.solution}</div></div></div>`:''}
    ${probs?`<div class="lesson__sec"><div class="lesson__label">Übungsaufgaben — auf Papier lösen</div>${probs}</div>`:''}
  </div>`;
}

function renderTopicPage(){
  const f = findTopic(currentTopic);
  if(!f){ currentTopic=null; render(); return; }
  const { subj, area, topic, flat, index } = f;
  const s = statusOf(topic); const done = isDone(topic.id); const r = store[topic.id]||{};
  const overridden = r.status && r.status!==topic.s;
  const prev = flat[index-1]; const next = flat[index+1];
  const wrap = document.getElementById('wrap');
  wrap.innerHTML = `
    <button class="tp-back" data-back>← ${subj.name}</button>
    <div class="tp-crumb"><b>${subj.name}</b> · ${area.name}</div>
    <div class="tp-head">
      <h1 class="tp-title">${topic.t}</h1>
      <button class="tp-badge" data-s="${s}" data-badge title="Einstufung ändern">${STATUS[s].label}</button>
    </div>
    <p class="tp-hint">${topic.h}</p>
    <button class="tp-mark ${done?'is-done':''}" data-mark><span class="box"></span>${done?'Als gelernt markiert':'Als gelernt markieren'}</button>
    <div class="tp-panel">
      ${learnHtml(topic)}
      <div class="note-block"><label class="note-label">Deine Notizen zu „${topic.t}"</label>
        <textarea class="note" data-note placeholder="Merksätze, Formeln, offene Fragen, Aufgabennummern …">${escapeHtml(r.note||'')}</textarea>
        ${overridden?`<div><button class="drawer__reset" data-resetstatus>Einstufung zurücksetzen (Vorschlag: ${STATUS[topic.s].label})</button></div>`:''}
      </div>
    </div>
    <div class="tp-nav">
      ${prev?`<button class="tp-navbtn prev" data-open="${prev.id}"><span class="tp-navbtn__lbl">← Vorheriges</span><span class="tp-navbtn__name">${prev.t}</span></button>`:`<span class="tp-navbtn is-empty"></span>`}
      ${next?`<button class="tp-navbtn next" data-open="${next.id}"><span class="tp-navbtn__lbl">Nächstes →</span><span class="tp-navbtn__name">${next.t}</span></button>`:`<span class="tp-navbtn is-empty"></span>`}
    </div>`;
  wrap.querySelector('[data-back]').addEventListener('click',()=>go(subj.id));
  wrap.querySelector('[data-mark]').addEventListener('click',()=>{ rec(topic.id).done = !isDone(topic.id); save(); renderTopicPage(); });
  wrap.querySelector('[data-badge]').addEventListener('click',()=>{ const cur=statusOf(topic); rec(topic.id).status = CYCLE[(CYCLE.indexOf(cur)+1)%CYCLE.length]; save(); renderTopicPage(); });
  const note = wrap.querySelector('[data-note]'); if(note) note.addEventListener('input',()=>{ rec(topic.id).note = note.value; save(); });
  const rs = wrap.querySelector('[data-resetstatus]'); if(rs) rs.addEventListener('click',()=>{ delete rec(topic.id).status; save(); renderTopicPage(); });
  wrap.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openTopic(b.getAttribute('data-open'))));
  wrap.querySelectorAll('[data-reveal]').forEach(btn=>btn.addEventListener('click',()=>{
    const sol = btn.nextElementSibling; const shown = sol.classList.toggle('is-shown');
    btn.textContent = shown ? 'Lösung verbergen' : 'Lösung anzeigen'; btn.setAttribute('aria-expanded', shown);
  }));
  typeset(wrap); window.scrollTo(0,0);
}

/* ---------- Advisory / Utils ---------- */
function advisoryHtml(){
  if(store.__advisoryClosed) return '';

    <button class="advisory__close" id="advisoryClose" aria-label="Hinweis schliessen">×</button>
    <h3>Zuerst prüfen: Brauchst du die Prüfung überhaupt?</h3>
    <p>Dein Abitur enthält <b>Mathematik als Leistungskurs</b> und <b>durchgehend Physik</b>. Damit erfüllst du zentrale Bedingungen, die die ETH an ausländische Reifezeugnisse stellt — möglicherweise ermöglicht dein Abitur bereits eine <b>prüfungsfreie Zulassung</b>.</p>
    <p>Kläre das <b>vor</b> monatelanger Vorbereitung direkt bei der ETH-Zulassungsstelle Bachelor ab (Akademische Dienste). Falls die reduzierte Prüfung doch nötig ist, bist du mit dieser Plattform vorbereitet.</p>
    <p style="color:var(--text-3);font-size:12.5px;margin-top:10px">Die Themenkarte bildet den Prüfungsstoff auf gymnasialem Maturitätsniveau ab (bestätigte „Fächergruppe 1"). Gleiche Schwerpunkte und Tiefe zusätzlich mit der offiziellen ETH-Wegleitung und alten Prüfungen ab.</p></div>`;
}
function bindAdvisory(){ const c = document.getElementById('advisoryClose'); if(c) c.addEventListener('click',()=>{ store.__advisoryClosed = true; save(); const a=document.getElementById('advisory'); if(a) a.remove(); }); }
function memoryWarn(){
  return `<div class="advisory" style="border-left-color:var(--deepen);margin-top:26px">
    <h3>Fortschritt wird hier nicht gespeichert</h3>
    <p>Dieser Tab kann keinen Speicher nutzen (z. B. Vorschau-Modus). <b>Lade die Datei herunter und öffne sie lokal im Browser</b> (Doppelklick auf die HTML-Datei) — dann bleiben Häkchen und Notizen dauerhaft auf deinem Gerät erhalten.</p></div>`;
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- Reset & Menü ---------- */
document.getElementById('resetAll').addEventListener('click',()=>{
  if(confirm('Wirklich den gesamten Fortschritt (Häkchen, Notizen, angepasste Einstufungen) löschen?')){ store = {}; save(); go(currentView); }
});
document.getElementById('railToggle').addEventListener('click',()=>{ document.getElementById('nav').classList.toggle('is-open'); });

render();
</script>
